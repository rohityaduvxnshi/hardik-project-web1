<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railway Login</title>

    <!-- Basic Tailwind CDN for simple utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100">

    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="login-box bg-white p-6 rounded shadow-md w-full max-w-sm">

            <div class="text-center mb-5">
                <div class="train-logo">🚆</div>
                <h1 class="text-2xl font-bold text-blue-700">Railway Booking</h1>
                <p class="text-gray-500 text-sm mt-1">Student Railway Reservation Website</p>
            </div>

            <form id="loginForm">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-1">Username</label>
                    <input type="text" id="username" class="simple-input" placeholder="Enter username">
                </div>

                <div class="mb-4">
                    <label class="block text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" class="simple-input" placeholder="Enter password">
                </div>

                <p id="loginMsg" class="text-red-600 text-sm mb-3"></p>

                <button type="submit" class="w-full bg-blue-700 text-white py-2 rounded hover:bg-blue-800">
                    Login
                </button>
            </form>

            <p class="text-xs text-gray-500 text-center mt-4">
                Demo project: use any username and password.
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
