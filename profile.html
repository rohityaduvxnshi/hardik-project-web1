<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100">

    <nav class="bg-blue-700 text-white p-4">
        <div class="container-box flex flex-col sm:flex-row justify-between items-center gap-3">
            <h1 class="text-xl font-bold">🚆 Railway Booking</h1>
            <div class="flex gap-4 text-sm">
                <a href="home.html" class="hover:underline">Home</a>
                <a href="profile.html" class="hover:underline">Profile</a>
                <button onclick="logoutUser()" class="hover:underline">Logout</button>
            </div>
        </div>
    </nav>

    <main class="container-box py-6">
        <section class="bg-white p-6 rounded shadow-sm max-w-xl mx-auto">
            <div class="text-center mb-5">
                <div class="profile-circle">👤</div>
                <h2 class="text-2xl font-bold text-blue-700 mt-2">User Profile</h2>
                <p class="text-gray-500 text-sm">Dummy user information</p>
            </div>

            <div class="profile-row">
                <b>Name:</b>
                <span id="profileName">Hardik Sharma</span>
            </div>

            <div class="profile-row">
                <b>Email:</b>
                <span>hardik@example.com</span>
            </div>

            <div class="profile-row">
                <b>Phone:</b>
                <span>9876543210</span>
            </div>

            <div class="profile-row">
                <b>City:</b>
                <span>Delhi</span>
            </div>

            <button onclick="editProfileMsg()" class="mt-5 bg-blue-700 text-white px-5 py-2 rounded hover:bg-blue-800">
                Edit Profile
            </button>

            <p id="editMsg" class="text-sm text-gray-600 mt-3"></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
